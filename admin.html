<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhaleShift Admin Panel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f0f2f5;
      color: #111827;
    }

    /* LOGIN SECTION */
    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #111827 0%, #1a2332 100%);
    }

    .login-box {
      background: white;
      padding: 50px;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
    }

    .login-box h1 {
      text-align: center;
      color: #d4af37;
      margin-bottom: 30px;
      font-size: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #333;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #d4af37;
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: #d4af37;
      color: #111827;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-btn:hover {
      background: #b8860b;
    }

    .error-message {
      color: #dc3545;
      text-align: center;
      margin-bottom: 20px;
      padding: 10px;
      background: #f8d7da;
      border-radius: 8px;
      display: none;
    }

    /* ADMIN PANEL */
    .admin-panel {
      display: none;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .header h1 {
      color: #d4af37;
      font-size: 28px;
    }

    .logout-btn {
      padding: 10px 20px;
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .logout-btn:hover {
      background: #c82333;
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      border-bottom: 2px solid #ddd;
    }

    .tab-btn {
      padding: 12px 25px;
      background: white;
      border: 2px solid #ddd;
      border-bottom: none;
      cursor: pointer;
      font-weight: bold;
      border-radius: 8px 8px 0 0;
      transition: 0.3s;
    }

    .tab-btn.active {
      background: #d4af37;
      color: white;
      border-color: #d4af37;
    }

    .tab-content {
      display: none;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }

    .tab-content.active {
      display: block;
    }

    .form-section {
      background: #f8f5ef;
      padding: 30px;
      border-radius: 15px;
      margin-bottom: 40px;
    }

    .form-section h3 {
      margin-bottom: 20px;
      color: #111827;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }

    .form-row.full {
      grid-template-columns: 1fr;
    }

    .form-group {
      margin-bottom: 0;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      font-family: Arial, sans-serif;
      transition: 0.3s;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #d4af37;
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
    }

    .add-btn {
      padding: 12px 30px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .add-btn:hover {
      background: #218838;
    }

    .products-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: #f8f5ef;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      transition: 0.3s;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .product-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .product-details {
      padding: 20px;
    }

    .product-details h4 {
      margin-bottom: 10px;
      color: #111827;
    }

    .product-details p {
      color: #666;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .product-details .price {
      font-size: 18px;
      font-weight: bold;
      color: #d4af37;
      margin-bottom: 15px;
    }

    .product-actions {
      display: flex;
      gap: 10px;
    }

    .edit-btn,
    .delete-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .edit-btn {
      background: #ffc107;
      color: white;
    }

    .edit-btn:hover {
      background: #e0a800;
    }

    .delete-btn {
      background: #dc3545;
      color: white;
    }

    .delete-btn:hover {
      background: #c82333;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 3000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 40px;
      border-radius: 15px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-content h3 {
      margin-bottom: 20px;
      color: #111827;
    }

    .close-btn {
      float: right;
      font-size: 28px;
      cursor: pointer;
      color: #666;
    }

    .close-btn:hover {
      color: #111827;
    }

    .save-btn {
      padding: 12px 30px;
      background: #d4af37;
      color: #111827;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
      width: 100%;
      margin-top: 20px;
    }

    .save-btn:hover {
      background: #b8860b;
    }

    .success-message {
      background: #d4edda;
      color: #155724;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    @media (max-width: 768px) {
      .form-row {
        grid-template-columns: 1fr;
      }

      .products-list {
        grid-template-columns: 1fr;
      }

      .tabs {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN SECTION -->
  <div id="loginSection" class="login-container">
    <div class="login-box">
      <h1>🔐 WhaleShift Admin</h1>
      <div class="error-message" id="errorMessage"></div>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="login-btn">Login</button>
      </form>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="adminPanel" class="admin-panel">
    <div class="header">
      <h1>WhaleShift Admin Panel</h1>
      <button class="logout-btn" onclick="handleLogout()">Logout</button>
    </div>

    <div class="container">
      <div class="success-message" id="successMessage"></div>

      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('watches')">⌚ Watches</button>
        <button class="tab-btn" onclick="switchTab('wallets')">👝 Wallets</button>
      </div>

      <!-- WATCHES TAB -->
      <div id="watches" class="tab-content active">
        <div class="form-section">
          <h3>Add New Watch</h3>
          <form onsubmit="handleAddProduct(event, 'watches')" id="watchForm">
            <div class="form-row">
              <div class="form-group">
                <label>Product Name</label>
                <input type="text" id="watchName" required>
              </div>
              <div class="form-group">
                <label>Price (Rs.)</label>
                <input type="number" id="watchPrice" min="0" step="0.01" required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Colors (comma separated)</label>
                <input type="text" id="watchColors" placeholder="e.g., Black, Silver, Gold">
              </div>
              <div class="form-group">
                <label>Stock</label>
                <input type="number" id="watchStock" min="0" required>
              </div>
            </div>

            <div class="form-row full">
              <div class="form-group">
                <label>Description</label>
                <textarea id="watchDescription" required></textarea>
              </div>
            </div>

            <div class="form-row full">
              <div class="form-group">
                <label>Image URL</label>
                <input type="url" id="watchImage" required>
              </div>
            </div>

            <button type="submit" class="add-btn">+ Add Watch</button>
          </form>
        </div>

        <h3>Watches Inventory</h3>
        <div class="products-list" id="watchesList"></div>
      </div>

      <!-- WALLETS TAB -->
      <div id="wallets" class="tab-content">
        <div class="form-section">
          <h3>Add New Wallet</h3>
          <form onsubmit="handleAddProduct(event, 'wallets')" id="walletForm">
            <div class="form-row">
              <div class="form-group">
                <label>Product Name</label>
                <input type="text" id="walletName" required>
              </div>
              <div class="form-group">
                <label>Price (Rs.)</label>
                <input type="number" id="walletPrice" min="0" step="0.01" required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Colors (comma separated)</label>
                <input type="text" id="walletColors" placeholder="e.g., Black, Brown, Red">
              </div>
              <div class="form-group">
                <label>Stock</label>
                <input type="number" id="walletStock" min="0" required>
              </div>
            </div>

            <div class="form-row full">
              <div class="form-group">
                <label>Description</label>
                <textarea id="walletDescription" required></textarea>
              </div>
            </div>

            <div class="form-row full">
              <div class="form-group">
                <label>Image URL</label>
                <input type="url" id="walletImage" required>
              </div>
            </div>

            <button type="submit" class="add-btn">+ Add Wallet</button>
          </form>
        </div>

        <h3>Wallets Inventory</h3>
        <div class="products-list" id="walletsList"></div>
      </div>
    </div>
  </div>

  <!-- EDIT MODAL -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h3>Edit Product</h3>
      <form onsubmit="handleUpdateProduct(event)" id="editForm">
        <div class="form-row">
          <div class="form-group">
            <label>Product Name</label>
            <input type="text" id="editName" required>
          </div>
          <div class="form-group">
            <label>Price (Rs.)</label>
            <input type="number" id="editPrice" min="0" step="0.01" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Colors (comma separated)</label>
            <input type="text" id="editColors">
          </div>
          <div class="form-group">
            <label>Stock</label>
            <input type="number" id="editStock" min="0" required>
          </div>
        </div>

        <div class="form-row full">
          <div class="form-group">
            <label>Description</label>
            <textarea id="editDescription" required></textarea>
          </div>
        </div>

        <div class="form-row full">
          <div class="form-group">
            <label>Image URL</label>
            <input type="url" id="editImage" required>
          </div>
        </div>

        <button type="submit" class="save-btn">Save Changes</button>
      </form>
    </div>
  </div>

  <script>
    // Admin credentials
    const ADMIN_EMAIL = 'whaleshift5@gmail.com';
    const ADMIN_PASSWORD = 'WS#Admin@2026!'; // Secure password

    let currentUser = null;
    let editingProduct = null;
    let editingCategory = null;

    // Initialize
    window.onload = function() {
      checkAuth();
      loadAllProducts();
    };

    function checkAuth() {
      currentUser = localStorage.getItem('adminUser');
      if (currentUser) {
        showAdminPanel();
      } else {
        showLoginSection();
      }
    }

    function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('errorMessage');

      if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
        localStorage.setItem('adminUser', email);
        currentUser = email;
        errorMessage.style.display = 'none';
        showAdminPanel();
      } else {
        errorMessage.textContent = 'Invalid email or password';
        errorMessage.style.display = 'block';
      }
    }

    function handleLogout() {
      localStorage.removeItem('adminUser');
      currentUser = null;
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
      showLoginSection();
    }

    function showLoginSection() {
      document.getElementById('loginSection').style.display = 'flex';
      document.getElementById('adminPanel').style.display = 'none';
    }

    function showAdminPanel() {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      loadAllProducts();
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      event.target.classList.add('active');
    }

    function handleAddProduct(event, category) {
      event.preventDefault();
      
      const prefix = category === 'watches' ? 'watch' : 'wallet';
      const product = {
        id: Date.now(),
        name: document.getElementById(prefix + 'Name').value,
        price: parseFloat(document.getElementById(prefix + 'Price').value),
        colors: document.getElementById(prefix + 'Colors').value,
        stock: parseInt(document.getElementById(prefix + 'Stock').value),
        description: document.getElementById(prefix + 'Description').value,
        image: document.getElementById(prefix + 'Image').value
      };

      let products = JSON.parse(localStorage.getItem(category)) || [];
      products.push(product);
      localStorage.setItem(category, JSON.stringify(products));

      // Clear form
      event.target.reset();

      // Show success message
      showSuccess('Product added successfully!');

      // Reload products
      loadAllProducts();
    }

    function loadAllProducts() {
      loadProducts('watches');
      loadProducts('wallets');
    }

    function loadProducts(category) {
      const products = JSON.parse(localStorage.getItem(category)) || [];
      const container = document.getElementById(category + 'List');

      container.innerHTML = products.map(product => `
        <div class="product-card">
          <img src="${product.image}" alt="${product.name}">
          <div class="product-details">
            <h4>${product.name}</h4>
            <p><strong>Price:</strong> Rs. ${product.price}</p>
            ${product.colors ? `<p><strong>Colors:</strong> ${product.colors}</p>` : ''}
            <p><strong>Stock:</strong> ${product.stock}</p>
            <p>${product.description}</p>
            <div class="product-actions">
              <button class="edit-btn" onclick="openEditModal('${category}', ${product.id})">✏️ Edit</button>
              <button class="delete-btn" onclick="deleteProduct('${category}', ${product.id})">🗑️ Delete</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function openEditModal(category, productId) {
      const products = JSON.parse(localStorage.getItem(category)) || [];
      const product = products.find(p => p.id === productId);

      if (product) {
        editingProduct = product;
        editingCategory = category;

        document.getElementById('editName').value = product.name;
        document.getElementById('editPrice').value = product.price;
        document.getElementById('editColors').value = product.colors;
        document.getElementById('editStock').value = product.stock;
        document.getElementById('editDescription').value = product.description;
        document.getElementById('editImage').value = product.image;

        document.getElementById('editModal').classList.add('active');
      }
    }

    function closeModal() {
      document.getElementById('editModal').classList.remove('active');
      editingProduct = null;
      editingCategory = null;
    }

    function handleUpdateProduct(event) {
      event.preventDefault();

      if (!editingProduct || !editingCategory) return;

      const products = JSON.parse(localStorage.getItem(editingCategory)) || [];
      const index = products.findIndex(p => p.id === editingProduct.id);

      if (index !== -1) {
        products[index] = {
          id: editingProduct.id,
          name: document.getElementById('editName').value,
          price: parseFloat(document.getElementById('editPrice').value),
          colors: document.getElementById('editColors').value,
          stock: parseInt(document.getElementById('editStock').value),
          description: document.getElementById('editDescription').value,
          image: document.getElementById('editImage').value
        };

        localStorage.setItem(editingCategory, JSON.stringify(products));
        closeModal();
        showSuccess('Product updated successfully!');
        loadAllProducts();
      }
    }

    function deleteProduct(category, productId) {
      if (confirm('Are you sure you want to delete this product?')) {
        let products = JSON.parse(localStorage.getItem(category)) || [];
        products = products.filter(p => p.id !== productId);
        localStorage.setItem(category, JSON.stringify(products));
        showSuccess('Product deleted successfully!');
        loadAllProducts();
      }
    }

    function showSuccess(message) {
      const successMessage = document.getElementById('successMessage');
      successMessage.textContent = message;
      successMessage.style.display = 'block';
      setTimeout(() => {
        successMessage.style.display = 'none';
      }, 3000);
    }

    // Close modal when clicking outside
    window.onclick = function(event) {
      const modal = document.getElementById('editModal');
      if (event.target === modal) {
        closeModal();
      }
    }
  </script>

</body>
</html>
